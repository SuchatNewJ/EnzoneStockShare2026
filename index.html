<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>ENZONE | สแกนสต็อกอุปกรณ์ไฟฟ้า</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
  :root{
    --navy:#0D2137; --navy2:#132C47; --orange:#F97316; --orange-d:#DC5F0A;
    --bg:#0A1826; --card:#12253A; --card2:#16304B; --line:#1E3A57;
    --text:#EAF1F8; --sub:#93A7BD; --green:#22C55E; --red:#EF4444;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:'Inter',sans-serif;-webkit-tap-highlight-color:transparent;}
  body{padding-bottom:env(safe-area-inset-bottom,0);}
  h1,h2,h3,.th{font-family:'Mitr',sans-serif;}
  header{background:linear-gradient(135deg,var(--navy),var(--navy2));
    padding:16px 16px calc(16px + env(safe-area-inset-top,0));
    padding-top:calc(16px + env(safe-area-inset-top,0));
    display:flex;align-items:center;justify-content:space-between;
    border-bottom:3px solid var(--orange);position:sticky;top:0;z-index:10;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand .logo{width:36px;height:36px;border-radius:9px;background:var(--orange);
    display:flex;align-items:center;justify-content:center;font-family:'Mitr';
    font-weight:600;color:var(--navy);font-size:15px;}
  .brand .title{font-family:'Mitr';font-weight:600;font-size:16px;line-height:1.2;}
  .brand .sub{font-size:11px;color:var(--sub);}
  .icon-btn{background:var(--card2);border:1px solid var(--line);color:var(--text);
    width:38px;height:38px;border-radius:10px;display:flex;align-items:center;
    justify-content:center;font-size:18px;cursor:pointer;}
  main{max-width:520px;margin:0 auto;padding:16px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:16px;margin-bottom:14px;}
  .scan-btn{width:100%;padding:18px;border:none;border-radius:16px;
    background:linear-gradient(135deg,var(--orange),var(--orange-d));
    color:#fff;font-family:'Mitr';font-weight:600;font-size:17px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:10px;
    box-shadow:0 6px 18px rgba(249,115,22,.3);}
  .scan-btn:active{transform:scale(.98);}
  .manual-row{display:flex;gap:8px;margin-top:12px;}
  .manual-row input{flex:1;background:var(--card2);border:1px solid var(--line);
    color:var(--text);border-radius:10px;padding:12px;font-size:16px;}
  .manual-row button{background:var(--card2);border:1px solid var(--line);
    color:var(--orange);border-radius:10px;padding:0 16px;font-weight:600;}
  #reader{width:100%;border-radius:14px;overflow:hidden;margin-top:12px;
    border:1px solid var(--line);display:none;}
  #reader.flash-success{animation:flashGreen .5s ease;}
  @keyframes flashGreen{
    0%{box-shadow:0 0 0 4px rgba(34,197,94,0);}
    30%{box-shadow:0 0 0 6px rgba(34,197,94,1);}
    100%{box-shadow:0 0 0 4px rgba(34,197,94,0);}
  }
  .reader-close{width:100%;margin-top:8px;padding:10px;background:var(--card2);
    border:1px solid var(--line);color:var(--sub);border-radius:10px;display:none;}
  .empty{text-align:center;color:var(--sub);padding:30px 10px;font-size:14px;}
  .product h2{margin:0 0 2px;font-size:19px;}
  .product .code-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
  .tag{font-size:11px;background:var(--card2);border:1px solid var(--line);
    color:var(--sub);padding:3px 9px;border-radius:20px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
  .stat{background:var(--card2);border:1px solid var(--line);border-radius:12px;
    padding:10px 12px;}
  .stat .l{font-size:11px;color:var(--sub);margin-bottom:2px;}
  .stat .v{font-size:16px;font-weight:600;}
  .qty-box{background:var(--card2);border:1px solid var(--line);border-radius:14px;
    padding:14px;}
  .qty-box .l{font-size:12px;color:var(--sub);margin-bottom:8px;}
  .qty-now{font-size:30px;font-weight:700;font-family:'Inter';margin-bottom:12px;}
  .qty-controls{display:flex;align-items:center;gap:10px;}
  .qty-controls button{width:46px;height:46px;border-radius:12px;border:none;
    font-size:22px;font-weight:700;cursor:pointer;}
  .qty-controls .minus{background:rgba(239,68,68,.15);color:var(--red);}
  .qty-controls .plus{background:rgba(34,197,94,.15);color:var(--green);}
  .qty-controls input{flex:1;text-align:center;background:var(--bg);
    border:1px solid var(--line);color:var(--text);border-radius:12px;
    padding:12px 6px;font-size:17px;font-weight:600;}
  .save-row{display:flex;gap:8px;margin-top:12px;}
  .save-row button{flex:1;padding:13px;border:none;border-radius:12px;
    font-family:'Mitr';font-weight:500;font-size:14px;cursor:pointer;}
  .btn-save{background:var(--orange);color:#fff;}
  .btn-cancel{background:var(--card2);border:1px solid var(--line);color:var(--sub);}
  .toast{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0));
    max-width:488px;margin:0 auto;background:var(--card2);border:1px solid var(--line);
    color:var(--text);padding:12px 16px;border-radius:12px;font-size:14px;
    text-align:center;opacity:0;transform:translateY(10px);transition:.25s;
    pointer-events:none;z-index:50;}
  .toast.show{opacity:1;transform:translateY(0);}
  .toast.err{border-color:var(--red);color:#FCA5A5;}
  .toast.ok{border-color:var(--green);color:#86EFAC;}
  .history-item{display:flex;justify-content:space-between;align-items:center;
    padding:10px 0;border-bottom:1px solid var(--line);font-size:13px;}
  .history-item:last-child{border-bottom:none;}
  .history-item .n{color:var(--text);}
  .history-item .c{color:var(--sub);font-size:11px;}
  .section-title{font-size:13px;color:var(--sub);margin:0 0 8px;font-family:'Mitr';}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;
    align-items:flex-end;justify-content:center;z-index:60;}
  .modal-bg.show{display:flex;}
  .modal{background:var(--card);border:1px solid var(--line);border-radius:18px 18px 0 0;
    width:100%;max-width:520px;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0));}
  .modal label{font-size:12px;color:var(--sub);display:block;margin:10px 0 4px;}
  .modal input{width:100%;background:var(--card2);border:1px solid var(--line);
    color:var(--text);border-radius:10px;padding:12px;font-size:14px;}
  .modal .hint{font-size:11px;color:var(--sub);margin-top:6px;line-height:1.5;}

  .notfound{text-align:center;padding:6px 2px 2px;}
  .nf-icon{font-size:32px;margin-bottom:6px;}
  .nf-title{color:var(--sub);font-size:13px;margin-bottom:4px;}
  .nf-code{font-family:'Inter';font-weight:700;font-size:18px;margin-bottom:18px;word-break:break-all;}
  .nf-actions{display:flex;flex-direction:column;gap:10px;}
  .opt-btn{display:flex;align-items:center;gap:12px;background:var(--card2);
    border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;
    cursor:pointer;color:var(--text);width:100%;}
  .opt-btn:active{transform:scale(.98);}
  .opt-emoji{font-size:24px;flex-shrink:0;}
  .opt-text{display:flex;flex-direction:column;gap:2px;}
  .opt-title{font-family:'Mitr';font-weight:500;font-size:15px;}
  .opt-sub{font-size:12px;color:var(--sub);}

  .flow-header{margin-bottom:12px;}
  .back-btn{background:none;border:none;color:var(--orange);font-size:13px;
    padding:0;margin-bottom:8px;cursor:pointer;}
  .flow-title{font-family:'Mitr';font-size:14px;line-height:1.5;}
  .flow-title .mono{font-family:'Inter';color:var(--sub);font-size:12px;}

  #linkSearchInput{width:100%;background:var(--card2);border:1px solid var(--line);
    color:var(--text);border-radius:10px;padding:12px;font-size:16px;margin-bottom:10px;}
  .link-results{display:flex;flex-direction:column;gap:8px;max-height:340px;overflow-y:auto;}
  .link-item{display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;}
  .li-name{font-size:14px;}
  .li-code{font-size:11px;color:var(--sub);margin-top:2px;}
  .li-select{background:var(--orange);color:#fff;border:none;border-radius:8px;
    padding:8px 14px;font-size:13px;font-weight:600;flex-shrink:0;cursor:pointer;}
  .empty.small{color:var(--sub);font-size:13px;text-align:center;padding:14px 0;}

  .addform label{font-size:12px;color:var(--sub);display:block;margin:10px 0 4px;}
  .addform input{width:100%;background:var(--card2);border:1px solid var(--line);
    color:var(--text);border-radius:10px;padding:11px;font-size:15px;}
  .form-row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .btn-save.full{width:100%;margin-top:16px;padding:14px;border:none;border-radius:12px;
    background:var(--orange);color:#fff;font-family:'Mitr';font-weight:600;font-size:15px;cursor:pointer;}
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="logo">EZ</div>
    <div>
      <div class="title">ENZONE Stock Scan</div>
      <div class="sub">สแกนบาร์โค้ด/QR เช็คสต็อกอุปกรณ์ไฟฟ้า</div>
    </div>
  </div>
  <button class="icon-btn" onclick="openSettings()">⚙</button>
</header>

<main>
  <div class="card">
    <button class="scan-btn" id="scanBtn" onclick="toggleScanner()">
      <span>▶</span><span>เริ่มสแกน</span>
    </button>
    <div id="reader"></div>
    <button class="reader-close" id="closeReaderBtn" onclick="stopScanner()">ปิดกล้อง</button>
    <div class="manual-row">
      <input type="text" id="manualInput" placeholder="พิมพ์รหัส/บาร์โค้ดเอง" inputmode="text">
      <button onclick="manualSearch()">ค้นหา</button>
    </div>
  </div>

  <div class="card" id="resultCard">
    <div class="empty">สแกนหรือพิมพ์รหัสสินค้าเพื่อดูข้อมูลสต็อก</div>
  </div>

  <div class="card" id="historyCard" style="display:none;">
    <div class="section-title">ประวัติการสแกนล่าสุด</div>
    <div id="historyList"></div>
  </div>
</main>

<div class="toast" id="toast"></div>

<div class="modal-bg" id="settingsModal">
  <div class="modal">
    <h3 style="margin:0 0 4px;">ตั้งค่าการเชื่อมต่อ</h3>
    <label>Google Apps Script Web App URL</label>
    <input type="text" id="apiUrlInput" placeholder="https://script.google.com/macros/s/.../exec">
    <div class="hint">
      วางลิงก์ Web App จากการ Deploy Apps Script (Code.gs) ที่เชื่อมกับสเปรดชีต
      product_stock_202609 ชีท "product"
    </div>
    <div class="save-row">
      <button class="btn-cancel" onclick="closeSettings()">ปิด</button>
      <button class="btn-save" onclick="saveSettings()">บันทึก</button>
    </div>
  </div>
</div>

<script>
const LS_KEYS = { apiUrl: 'ez_scan_api_url', history: 'ez_scan_history' };
let html5QrCode = null;
let scanning = false;
let currentProduct = null;

function getApiUrl(){ return localStorage.getItem(LS_KEYS.apiUrl) || ''; }
function setApiUrl(v){ localStorage.setItem(LS_KEYS.apiUrl, v); }

function openSettings(){
  document.getElementById('apiUrlInput').value = getApiUrl();
  document.getElementById('settingsModal').classList.add('show');
}
function closeSettings(){ document.getElementById('settingsModal').classList.remove('show'); }
function saveSettings(){
  const v = document.getElementById('apiUrlInput').value.trim();
  if(!v){ toast('กรุณาใส่ URL', 'err'); return; }
  setApiUrl(v);
  toast('บันทึกการตั้งค่าแล้ว', 'ok');
  closeSettings();
}

function toast(msg, type){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type ? ' ' + type : '');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=> t.classList.remove('show'), 2400);
}

// ---------- Scanner ----------
function toggleScanner(){
  if(scanning){ stopScanner(); return; }
  if(!getApiUrl()){ toast('ตั้งค่า Web App URL ก่อนใช้งาน', 'err'); openSettings(); return; }
  const reader = document.getElementById('reader');
  reader.style.display = 'block';
  document.getElementById('closeReaderBtn').style.display = 'block';
  document.getElementById('scanBtn').innerHTML = '<span>⏳</span><span>กำลังเปิดกล้อง...</span>';
  html5QrCode = new Html5Qrcode('reader');
  html5QrCode.start(
    { facingMode: 'environment' },
    { fps: 10, qrbox: { width: 250, height: 150 } },
    (decodedText) => { onScanSuccess(decodedText); },
    () => {}
  ).then(()=>{
    scanning = true;
    document.getElementById('scanBtn').innerHTML = '<span>⏸</span><span>กำลังสแกน...</span>';
  }).catch((err)=>{
    toast('เปิดกล้องไม่ได้: ' + err, 'err');
    resetScanUI();
  });
}
function stopScanner(){
  if(html5QrCode && scanning){
    html5QrCode.stop().then(()=>{ html5QrCode.clear(); resetScanUI(); }).catch(()=> resetScanUI());
  } else {
    resetScanUI();
  }
}
function resetScanUI(){
  scanning = false;
  scanLocked = false;
  document.getElementById('reader').style.display = 'none';
  document.getElementById('closeReaderBtn').style.display = 'none';
  document.getElementById('scanBtn').innerHTML = '<span>▶</span><span>เริ่มสแกน</span>';
}
let scanLocked = false;
function onScanSuccess(code){
  if(scanLocked) return; // กันไม่ให้ยิงซ้ำระหว่างที่กำลังกระพริบ/หยุดกล้อง
  scanLocked = true;
  if(navigator.vibrate) navigator.vibrate(80);
  const readerEl = document.getElementById('reader');
  readerEl.classList.add('flash-success');
  setTimeout(() => {
    readerEl.classList.remove('flash-success');
    stopScanner();
    lookupProduct(code);
  }, 500);
}
function manualSearch(){
  const v = document.getElementById('manualInput').value.trim();
  if(!v){ return; }
  if(!getApiUrl()){ toast('ตั้งค่า Web App URL ก่อนใช้งาน', 'err'); openSettings(); return; }
  lookupProduct(v);
}

// ---------- API ----------
let lastScannedCode = '';

async function lookupProduct(query){
  document.getElementById('resultCard').innerHTML = '<div class="empty">กำลังค้นหา...</div>';
  try{
    const url = getApiUrl() + '?action=search&q=' + encodeURIComponent(query);
    const res = await fetch(url);
    const data = await res.json();
    if(!data.ok){
      lastScannedCode = query;
      document.getElementById('resultCard').innerHTML = renderNotFoundHtml(query);
      toast('ไม่พบสินค้า', 'err');
      return;
    }
    currentProduct = data.product;
    renderProduct(currentProduct);
    pushHistory(currentProduct);
  }catch(err){
    document.getElementById('resultCard').innerHTML = '<div class="empty">เชื่อมต่อไม่สำเร็จ ตรวจสอบ URL ในตั้งค่า</div>';
    toast('เชื่อมต่อไม่สำเร็จ', 'err');
  }
}

// ---------- Not found → link existing / add new ----------
function renderNotFoundHtml(code){
  return `
    <div class="notfound">
      <div class="nf-icon">❓</div>
      <div class="nf-title">ไม่พบสินค้ารหัสนี้ในระบบ</div>
      <div class="nf-code">${escapeHtml(code)}</div>
      <div class="nf-actions">
        <button class="opt-btn" onclick="renderLinkFlow()">
          <span class="opt-emoji">🔗</span>
          <span class="opt-text">
            <span class="opt-title">ผูกกับสินค้าเดิม</span>
            <span class="opt-sub">สินค้าที่มีอยู่แล้ว แต่ยังไม่มีบาร์โค้ด</span>
          </span>
        </button>
        <button class="opt-btn" onclick="renderAddForm()">
          <span class="opt-emoji">➕</span>
          <span class="opt-text">
            <span class="opt-title">เพิ่มสินค้าใหม่</span>
            <span class="opt-sub">สินค้าที่ยังไม่เคยมีในระบบเลย</span>
          </span>
        </button>
      </div>
    </div>`;
}

function backToNotFound(){
  document.getElementById('resultCard').innerHTML = renderNotFoundHtml(lastScannedCode);
}

function renderLinkFlow(){
  document.getElementById('resultCard').innerHTML = `
    <div class="linkflow">
      <div class="flow-header">
        <button class="back-btn" onclick="backToNotFound()">‹ ย้อนกลับ</button>
        <div class="flow-title">ผูกบาร์โค้ด <b>${escapeHtml(lastScannedCode)}</b><br>กับสินค้าเดิม</div>
      </div>
      <input type="text" id="linkSearchInput" placeholder="พิมพ์ชื่อหรือรหัสสินค้า...">
      <div id="linkResults" class="link-results"><div class="empty small">พิมพ์เพื่อค้นหาสินค้า</div></div>
    </div>`;
  const inp = document.getElementById('linkSearchInput');
  inp.addEventListener('input', debouncedLinkSearch);
  inp.focus();
}

let linkSearchTimer = null;
function debouncedLinkSearch(){
  clearTimeout(linkSearchTimer);
  linkSearchTimer = setTimeout(runLinkSearch, 350);
}

async function runLinkSearch(){
  const box = document.getElementById('linkResults');
  const inp = document.getElementById('linkSearchInput');
  if(!inp) return;
  const q = inp.value.trim();
  if(!q){ box.innerHTML = '<div class="empty small">พิมพ์เพื่อค้นหาสินค้า</div>'; return; }
  box.innerHTML = '<div class="empty small">กำลังค้นหา...</div>';
  try{
    const url = getApiUrl() + '?action=find&q=' + encodeURIComponent(q);
    const res = await fetch(url);
    const data = await res.json();
    if(!data.ok || !data.items || data.items.length === 0){
      box.innerHTML = '<div class="empty small">ไม่พบสินค้าที่ตรงกัน</div>';
      return;
    }
    box.innerHTML = data.items.map(it => `
      <div class="link-item">
        <div class="li-info">
          <div class="li-name">${escapeHtml(it.name||'-')}</div>
          <div class="li-code">${escapeHtml(it.default_code||'-')} ${it.barcode ? '· มีบาร์โค้ดแล้ว: '+escapeHtml(it.barcode) : '· ยังไม่มีบาร์โค้ด'}</div>
        </div>
        <button class="li-select" data-code="${escapeAttr(it.default_code)}">เลือก</button>
      </div>`).join('');
    Array.from(box.querySelectorAll('.li-select')).forEach(btn => {
      btn.onclick = () => linkToProduct(btn.getAttribute('data-code'));
    });
  }catch(err){
    box.innerHTML = '<div class="empty small">เชื่อมต่อไม่สำเร็จ</div>';
  }
}

async function linkToProduct(targetCode){
  try{
    const data = await postAction({ action: 'link_barcode', barcode: lastScannedCode, target_code: targetCode });
    if(data.ok){
      toast('ผูกบาร์โค้ดสำเร็จ', 'ok');
      currentProduct = data.product;
      renderProduct(currentProduct);
      pushHistory(currentProduct);
    } else if(data.error === 'duplicate_barcode'){
      toast('บาร์โค้ดนี้ถูกใช้กับ "' + (data.existing && data.existing.name || '') + '" อยู่แล้ว', 'err');
    } else {
      toast('ผูกไม่สำเร็จ: ' + (data.error||''), 'err');
    }
  }catch(err){ toast('เชื่อมต่อไม่สำเร็จ', 'err'); }
}

function renderAddForm(){
  document.getElementById('resultCard').innerHTML = `
    <div class="addform">
      <div class="flow-header">
        <button class="back-btn" onclick="backToNotFound()">‹ ย้อนกลับ</button>
        <div class="flow-title">เพิ่มสินค้าใหม่<br><span class="mono">บาร์โค้ด: ${escapeHtml(lastScannedCode)}</span></div>
      </div>
      <label>ชื่อสินค้า *</label>
      <input type="text" id="np_name" placeholder="เช่น เบรกเกอร์ 3P 100A">
      <div class="form-row2">
        <div><label>แบรนด์</label><input type="text" id="np_brand" placeholder="เช่น Schneider"></div>
        <div><label>หมวดหมู่</label><input type="text" id="np_categ" placeholder="เช่น เบรกเกอร์"></div>
      </div>
      <div class="form-row2">
        <div><label>จำนวน</label><input type="number" id="np_qty" value="0"></div>
        <div><label>หน่วย</label><input type="text" id="np_uom" placeholder="เช่น ตัว, ชุด"></div>
      </div>
      <div class="form-row2">
        <div><label>ราคา (บาท)</label><input type="number" id="np_price" value="0"></div>
        <div><label>ที่เก็บ</label><input type="text" id="np_location" placeholder="เช่น ชั้น A2"></div>
      </div>
      <label>รหัสสินค้า (ProductID)</label>
      <input type="text" id="np_code" placeholder="เว้นว่างให้ระบบออกรหัสให้อัตโนมัติ">
      <button class="btn-save full" onclick="submitNewProduct()">บันทึกสินค้าใหม่</button>
    </div>`;
  document.getElementById('np_name').focus();
}

async function submitNewProduct(){
  const name = document.getElementById('np_name').value.trim();
  if(!name){ toast('กรุณากรอกชื่อสินค้า', 'err'); return; }
  const payload = {
    action: 'add_product',
    barcode: lastScannedCode,
    product: {
      name: name,
      brand: document.getElementById('np_brand').value.trim(),
      categ_id: document.getElementById('np_categ').value.trim(),
      qty_available: Number(document.getElementById('np_qty').value) || 0,
      uom_id: document.getElementById('np_uom').value.trim(),
      list_price: Number(document.getElementById('np_price').value) || 0,
      location: document.getElementById('np_location').value.trim(),
      default_code: document.getElementById('np_code').value.trim()
    }
  };
  try{
    const data = await postAction(payload);
    if(data.ok){
      toast('เพิ่มสินค้าใหม่สำเร็จ', 'ok');
      currentProduct = data.product;
      renderProduct(currentProduct);
      pushHistory(currentProduct);
    } else if(data.error === 'duplicate_barcode' || data.error === 'duplicate_code'){
      toast('รหัสนี้ถูกใช้กับ "' + (data.existing && data.existing.name || '') + '" อยู่แล้ว', 'err');
    } else if(data.error === 'missing_name'){
      toast('กรุณากรอกชื่อสินค้า', 'err');
    } else {
      toast('บันทึกไม่สำเร็จ: ' + (data.error||''), 'err');
    }
  }catch(err){ toast('เชื่อมต่อไม่สำเร็จ', 'err'); }
}

async function postAction(payload){
  const res = await fetch(getApiUrl(), {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  });
  return res.json();
}

async function adjustQty(delta){
  if(!currentProduct) return;
  try{
    const data = await postAction({
      action: 'adjust_qty',
      barcode: currentProduct.barcode,
      default_code: currentProduct.default_code,
      delta: delta
    });
    if(data.ok){
      currentProduct.qty_available = data.qty_available;
      document.getElementById('qtyNow').textContent = data.qty_available;
      toast((delta > 0 ? 'เพิ่ม ' : 'ตัด ') + Math.abs(delta) + ' หน่วยแล้ว', 'ok');
    } else {
      toast('อัปเดตไม่สำเร็จ: ' + (data.error||''), 'err');
    }
  }catch(err){ toast('เชื่อมต่อไม่สำเร็จ', 'err'); }
}

async function setQtyManual(){
  if(!currentProduct) return;
  const val = Number(document.getElementById('qtyInput').value);
  if(isNaN(val)){ toast('กรอกจำนวนให้ถูกต้อง', 'err'); return; }
  try{
    const data = await postAction({
      action: 'set_qty',
      barcode: currentProduct.barcode,
      default_code: currentProduct.default_code,
      qty_available: val
    });
    if(data.ok){
      currentProduct.qty_available = data.qty_available;
      document.getElementById('qtyNow').textContent = data.qty_available;
      toast('บันทึกจำนวนแล้ว', 'ok');
    } else {
      toast('อัปเดตไม่สำเร็จ: ' + (data.error||''), 'err');
    }
  }catch(err){ toast('เชื่อมต่อไม่สำเร็จ', 'err'); }
}

// ---------- Render ----------
function renderProduct(p){
  const price = Number(p.list_price)||0;
  const cost = Number(p.standard_price)||0;
  document.getElementById('resultCard').innerHTML = `
    <div class="product">
      <h2>${escapeHtml(p.name||'-')}</h2>
      <div class="code-row">
        <span class="tag">รหัส: ${escapeHtml(p.default_code||'-')}</span>
        <span class="tag">บาร์โค้ด: ${escapeHtml(p.barcode||'-')}</span>
        <span class="tag">หมวด: ${escapeHtml(p.categ_id||'-')}</span>
        <span class="tag">หน่วย: ${escapeHtml(p.uom_id||'-')}</span>
      </div>
      <div class="grid2">
        <div class="stat"><div class="l">ราคาขาย</div><div class="v">${price.toLocaleString()} บาท</div></div>
        <div class="stat"><div class="l">ต้นทุน</div><div class="v">${cost.toLocaleString()} บาท</div></div>
      </div>
      <div class="qty-box">
        <div class="l">จำนวนคงเหลือในสต็อก</div>
        <div class="qty-now" id="qtyNow">${p.qty_available}</div>
        <div class="qty-controls">
          <button class="minus" onclick="adjustQty(-1)">−</button>
          <input type="number" id="qtyInput" value="${p.qty_available}">
          <button class="plus" onclick="adjustQty(1)">+</button>
        </div>
        <div class="save-row">
          <button class="btn-cancel" onclick="adjustQty(-5)">−5</button>
          <button class="btn-cancel" onclick="adjustQty(5)">+5</button>
          <button class="btn-save" onclick="setQtyManual()">บันทึกจำนวนนี้</button>
        </div>
      </div>
    </div>`;
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s){
  return String(s==null?'':s).replace(/"/g,'&quot;');
}

// ---------- History ----------
function pushHistory(p){
  let hist = JSON.parse(localStorage.getItem(LS_KEYS.history) || '[]');
  hist = hist.filter(h => h.barcode !== p.barcode || h.default_code !== p.default_code);
  hist.unshift({ name:p.name, default_code:p.default_code, barcode:p.barcode, t: Date.now() });
  hist = hist.slice(0, 15);
  localStorage.setItem(LS_KEYS.history, JSON.stringify(hist));
  renderHistory();
}
function renderHistory(){
  const hist = JSON.parse(localStorage.getItem(LS_KEYS.history) || '[]');
  const card = document.getElementById('historyCard');
  const list = document.getElementById('historyList');
  if(hist.length === 0){ card.style.display = 'none'; return; }
  card.style.display = 'block';
  list.innerHTML = hist.map(h => `
    <div class="history-item">
      <div>
        <div class="n">${escapeHtml(h.name||'-')}</div>
        <div class="c">${escapeHtml(h.default_code||'')} · ${escapeHtml(h.barcode||'')}</div>
      </div>
    </div>`).join('');
  // rebind click to re-lookup
  Array.from(list.children).forEach((el, i) => {
    el.style.cursor = 'pointer';
    el.onclick = () => lookupProduct(hist[i].barcode || hist[i].default_code);
  });
}

// init
renderHistory();
document.getElementById('manualInput').addEventListener('keydown', e => {
  if(e.key === 'Enter') manualSearch();
});
if(!getApiUrl()){ setTimeout(openSettings, 400); }
</script>
